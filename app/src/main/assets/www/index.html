<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#12141C">
  <meta name="color-scheme" content="dark">
  <title>LeaveBy</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main id="screen" aria-live="polite"></main>
    <nav id="tabs" aria-label="Main">
      <button class="tab" data-act="tab" data-tab="home" aria-label="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9v4l2.5 2.5M9 2h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Plan</span>
      </button>
      <button class="tab" data-act="tab" data-tab="history" aria-label="History">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span>History</span>
      </button>
      <button class="tab" data-act="tab" data-tab="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>
  <div id="dialog-root"></div>
  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
